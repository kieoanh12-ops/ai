
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Phát Âm Tiếng Anh 11 - A Long and Healthy Life</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white py-6 shadow-md text-center">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide">ENGLISH PRONUNCIATION PRACTICE</h1>
        <p class="text-blue-100 mt-1">Unit 1: A Long and Healthy Life (Global Success 11)</p>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100 flex flex-col h-[600px]">
            <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-book text-blue-500"></i> Danh sách từ vựng
            </h2>
            
            <div class="flex gap-2 mb-4 bg-slate-100 p-1 rounded-xl text-sm font-medium">
                <button onclick="filterWords('all')" id="btn-all" class="flex-1 py-2 rounded-lg text-center bg-white text-blue-600 shadow-xs cursor-pointer">Tất cả</button>
                <button onclick="filterWords('easy')" id="btn-easy" class="flex-1 py-2 rounded-lg text-center text-slate-600 hover:text-slate-800 cursor-pointer">Dễ</button>
                <button onclick="filterWords('hard')" id="btn-hard" class="flex-1 py-2 rounded-lg text-center text-slate-600 hover:text-slate-800 cursor-pointer">Khó</button>
            </div>

            <div id="word-list" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                </div>
        </div>

        <div class="md:col-span-2 bg-white rounded-2xl shadow-sm p-6 border border-slate-100 flex flex-col justify-between min-h-[500px]">
            
            <div class="text-center flex-1 flex flex-col items-center justify-center my-4">
                <span id="word-difficulty" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3"></span>
                <h2 id="current-word" class="text-4xl md:text-5xl font-black text-slate-800 tracking-tight mb-1">Select a word</h2>
                <p id="current-meaning" class="text-slate-500 italic text-lg mb-4"></p>
                
                <div class="w-48 h-32 md:w-64 md:h-40 rounded-xl overflow-hidden bg-slate-100 shadow-inner mb-6 flex items-center justify-center border border-slate-200">
                    <img id="word-image" src="" alt="Vocabulary illustration" class="w-full h-full object-cover hidden">
                    <i id="image-placeholder" class="fa-regular fa-image text-4xl text-slate-300"></i>
                </div>
            </div>

            <div class="text-center mb-6">
                <div id="score-container" class="hidden inline-flex flex-col items-center">
                    <div id="score-circle" class="w-24 h-24 rounded-full border-4 flex items-center justify-center text-3xl font-black mb-2 animate-bounce">
                        <span id="score-text">0%</span>
                    </div>
                    <p id="feedback-text" class="text-sm font-semibold"></p>
                    <p id="speech-transcript" class="text-xs text-slate-400 mt-1 italic"></p>
                </div>
            </div>

            <div class="border-t border-slate-100 pt-6">
                <div class="grid grid-cols-3 gap-4 max-w-md mx-auto">
                    
                    <button onclick="listenSample()" id="btn-listen" class="flex flex-col items-center justify-center p-3 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition cursor-pointer group" title="Nghe đọc mẫu">
                        <i class="fa-solid fa-volume-high text-xl group-hover:scale-110 transition"></i>
                        <span class="text-xs font-bold mt-1">Nghe mẫu</span>
                    </button>

                    <button onclick="toggleRecognition()" id="btn-mic" class="flex flex-col items-center justify-center p-4 bg-red-500 text-white rounded-full hover:bg-red-600 shadow-md shadow-red-200 transition transform hover:scale-105 cursor-pointer relative" style="width: 70px; height: 70px; margin: 0 auto; top: -15px;">
                        <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
                        <span id="mic-text" class="absolute -bottom-6 text-xs font-bold text-slate-600 w-24 text-center">Bắt đầu nói</span>
                    </button>

                    <button onclick="playbackVoice()" id="btn-playback" disabled class="flex flex-col items-center justify-center p-3 bg-slate-50 text-slate-400 rounded-xl transition opacity-50 cursor-not-allowed group" title="Nghe lại giọng của bạn">
                        <i class="fa-solid fa-reply text-xl group-hover:scale-110 transition"></i>
                        <span class="text-xs font-bold mt-1">Nghe lại mình</span>
                    </button>
                    
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white mt-6">
        © 2026 Luyện Phát Âm Tiếng Anh Mỹ - Global Success 11
    </footer>

    <script>
        // 1. Data Vocabulary (Sách giáo khoa + Bổ sung thêm 7 từ dễ, 5 từ khó)
        const vocabulary = [
            // Từ gốc trong SGK
            { word: "longevity", meaning: "tuổi thọ", difficulty: "hard", keyword: "old age longevity" },
            { word: "immune system", meaning: "hệ miễn dịch", difficulty: "hard", keyword: "immune system cell" },
            { word: "infectious disease", meaning: "bệnh truyền nhiễm", difficulty: "hard", keyword: "virus virus" },
            { word: "preservative", meaning: "chất bảo quản", difficulty: "hard", keyword: "canned food canned" },
            { word: "disinfectant", meaning: "chất khử trùng", difficulty: "hard", keyword: "antiseptic alcohol" },
            
            // 7 Từ DỄ bổ sung thêm (Chủ đề sức khỏe)
            { word: "healthy", meaning: "khỏe mạnh", difficulty: "easy", keyword: "healthy lifestyle fitness" },
            { word: "fitness", meaning: "sự cân đối, sung sức", difficulty: "easy", keyword: "fitness workout gym" },
            { word: "exercise", meaning: "tập thể dục", difficulty: "easy", keyword: "running exercise" },
            { word: "energy", meaning: "năng lượng", difficulty: "easy", keyword: "energy active running" },
            { word: "diet", meaning: "chế độ ăn uống", difficulty: "easy", keyword: "diet salad food" },
            { word: "sleep", meaning: "giấc ngủ", difficulty: "easy", keyword: "sleeping bed" },
            { word: "active", meaning: "năng động", difficulty: "easy", keyword: "active outdoor sport" },

            // 5 Từ KHÓ bổ sung thêm (Chủ đề sức khỏe nâng cao)
            { word: "nutritious", meaning: "giàu dinh dưỡng", difficulty: "hard", keyword: "nutritious meal vegetable" },
            { word: "life expectancy", meaning: "tuổi thọ dự tính", difficulty: "hard", keyword: "elderly happy life" },
            { word: "bacteria", meaning: "vi khuẩn", difficulty: "hard", keyword: "microscope bacteria" },
            { word: "treatment", meaning: "sự điều trị", difficulty: "hard", keyword: "hospital treatment doctor" },
            { word: "organism", meaning: "sinh vật, cơ thể", difficulty: "hard", keyword: "organism cell nature" }
        ];

        let currentWordIndex = 0;
        let filteredWords = [...vocabulary];
        let mediaRecorder;
        let audioChunks = [];
        let audioUrl = null;
        let recognition;
        let isRecordingInstance = false;

        // Init Speech Recognition API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US'; // Chuẩn giọng Anh - Mỹ
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecordingInstance = true;
                updateMicUI(true);
                startAudioRecording(); // Ghi âm đồng thời để nghe lại
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                stopAudioRecording(false);
                updateMicUI(false);
                alert("Không nhận diện được giọng nói. Vui lòng kiểm tra Micro hoặc thử lại!");
            };

            recognition.onend = () => {
                isRecordingInstance = false;
                updateMicUI(false);
            };

            recognition.onresult = (event) => {
                stopAudioRecording(true);
                const resultText = event.results[0][0].transcript.toLowerCase().trim();
                calculateScore(resultText);
            };
        } else {
            alert("Trình duyệt của bạn không hỗ trợ Web Speech API. Hãy sử dụng Google Chrome hoặc MS Edge mới nhất!");
        }

        // 2. Render & UI Functions
        function initApp() {
            renderWordList();
            selectWord(0);
            initMediaRecorder();
        }

        function renderWordList() {
            const listContainer = document.getElementById('word-list');
            listContainer.innerHTML = '';
            
            filteredWords.forEach((item, index) => {
                const isSelected = vocabulary[currentWordIndex].word === item.word;
                const diffColor = item.difficulty === 'easy' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
                
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border transition cursor-pointer flex justify-between items-center ${isSelected ? 'border-blue-500 bg-blue-50/50 shadow-xs' : 'border-slate-100 hover:bg-slate-50'}`;
                card.onclick = () => {
                    const originalIndex = vocabulary.findIndex(v => v.word === item.word);
                    selectWord(originalIndex);
                };

                card.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 text-base">${item.word}</div>
                        <div class="text-xs text-slate-500">${item.meaning}</div>
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded-md font-bold uppercase ${diffColor}">${item.difficulty}</span>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterWords(type) {
            // Update Tab active UI
            ['all', 'easy', 'hard'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(t === type) {
                    btn.className = "flex-1 py-2 rounded-lg text-center bg-white text-blue-600 shadow-xs font-semibold cursor-pointer";
                } else {
                    btn.className = "flex-1 py-2 rounded-lg text-center text-slate-600 hover:text-slate-800 cursor-pointer";
                }
            });

            if (type === 'all') {
                filteredWords = [...vocabulary];
            } else {
                filteredWords = vocabulary.filter(w => w.difficulty === type);
            }
            renderWordList();
            if(filteredWords.length > 0) {
                const originalIndex = vocabulary.findIndex(v => v.word === filteredWords[0].word);
                selectWord(originalIndex);
            }
        }

        function selectWord(index) {
            currentWordIndex = index;
            const target = vocabulary[index];
            
            document.getElementById('current-word').innerText = target.word;
            document.getElementById('current-meaning').innerText = target.meaning;
            
            // Set Difficulty Badge
            const diffBadge = document.getElementById('word-difficulty');
            diffBadge.innerText = target.difficulty;
            if(target.difficulty === 'easy') {
                diffBadge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3 bg-green-100 text-green-700";
            } else {
                diffBadge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3 bg-amber-100 text-amber-700";
            }

            // Load Illustration Image dynamically
            const imgEl = document.getElementById('word-image');
            const placeholderEl = document.getElementById('image-placeholder');
            imgEl.classList.add('hidden');
            placeholderEl.classList.remove('hidden');
            
            // Source ảnh minh họa Unsplash theo từ khóa chủ đề sạch
            imgEl.src = `https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=400&q=80&sig=${target.word}`; 
            // Có thể đổi link ảnh custom theo cấu trúc keyword: `https://source.unsplash.com/featured/400x300/?${encodeURIComponent(target.keyword)}`
            
            imgEl.onload = () => {
                imgEl.classList.remove('hidden');
                placeholderEl.classList.add('hidden');
            };

            // Reset Scoring UI & Audio playback
            document.getElementById('score-container').classList.add('hidden');
            resetPlayback();

            // Re-render list to match highlight border
            renderWordList();
        }

        function updateMicUI(isRecording) {
            const micBtn = document.getElementById('btn-mic');
            const micIcon = document.getElementById('mic-icon');
            const micText = document.getElementById('mic-text');

            if(isRecording) {
                micBtn.className = "flex flex-col items-center justify-center p-4 bg-red-600 text-white rounded-full shadow-lg shadow-red-300 ring-4 ring-red-200 animate-pulse cursor-pointer relative";
                micIcon.className = "fa-solid fa-stop text-2xl";
                micText.innerText = "Đang ghi âm...";
                micText.classList.add("text-red-600");
            } else {
                micBtn.className = "flex flex-col items-center justify-center p-4 bg-red-500 text-white rounded-full hover:bg-red-600 shadow-md shadow-red-200 transition transform hover:scale-105 cursor-pointer relative";
                micIcon.className = "fa-solid fa-microphone text-2xl";
                micText.innerText = "Bắt đầu nói";
                micText.classList.remove("text-red-600");
            }
            micBtn.style.width = "70px";
            micBtn.style.height = "70px";
            micBtn.style.margin = "0 auto";
            micBtn.style.top = "-15px";
        }

        // 3. Audio & Voice Operations
        function listenSample() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Ngắt âm đang phát nếu có
                const text = vocabulary[currentWordIndex].word;
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Cố gắng tìm giọng chuẩn Anh - Mỹ (en-US)
                const voices = window.speechSynthesis.getVoices();
                const usVoice = voices.find(voice => voice.lang.includes('en-US'));
                if (usVoice) utterance.voice = usVoice;
                
                utterance.rate = 0.85; // Đọc hơi chậm một chút để học sinh dễ nghe
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt của bạn không hỗ trợ phát âm mẫu.");
            }
        }

        function toggleRecognition() {
            if (isRecordingInstance) {
                recognition.stop();
            } else {
                if(recognition) {
                    resetPlayback();
                    recognition.start();
                }
            }
        }

        function initMediaRecorder() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        audioUrl = URL.createObjectURL(audioBlob);
                        enablePlayback();
                    };
                }).catch(err => {
                    console.log("Quyền micro bị từ chối hoặc lỗi:", err);
                });
            }
        }

        function startAudioRecording() {
            if(mediaRecorder && mediaRecorder.state === "inactive") {
                audioChunks = [];
                mediaRecorder.start();
            }
        }

        function stopAudioRecording(saveData) {
            if(mediaRecorder && mediaRecorder.state === "recording") {
                if(!saveData) {
                    mediaRecorder.onstop = () => {}; // Hủy callback lưu dữ liệu nếu lỗi mic
                    mediaRecorder.stop();
                    initMediaRecorder(); // Reset lại thiết bị ghi
                } else {
                    mediaRecorder.stop();
                }
            }
        }

        function enablePlayback() {
            const playBtn = document.getElementById('btn-playback');
            playBtn.disabled = false;
            playBtn.className = "flex flex-col items-center justify-center p-3 bg-green-50 text-green-600 rounded-xl hover:bg-green-100 transition cursor-pointer group";
        }

        function resetPlayback() {
            const playBtn = document.getElementById('btn-playback');
            playBtn.disabled = true;
            playBtn.className = "flex flex-col items-center justify-center p-3 bg-slate-50 text-slate-400 rounded-xl transition opacity-50 cursor-not-allowed group";
            if(audioUrl) {
                URL.revokeObjectURL(audioUrl);
                audioUrl = null;
            }
        }

        function playbackVoice() {
            if(audioUrl) {
                const audio = new Audio(audioUrl);
                audio.play();
            }
        }

        // 4. Algorithm Chấm điểm thông minh đơn giản
        function calculateScore(spokenText) {
            const targetText = vocabulary[currentWordIndex].word.toLowerCase().trim();
            document.getElementById('speech-transcript').innerText = `Bạn đã nói: "${spokenText}"`;

            let score = 0;
            if (spokenText === targetText) {
                score = 100;
            } else {
                // Thuật toán so sánh khoảng cách chuỗi cơ bản (Levenshtein hoặc trùng từ ký tự)
                const maxLength = Math.max(targetText.length, spokenText.length);
                let matches = 0;
                for(let i=0; i < Math.min(targetText.length, spokenText.length); i++){
                    if(targetText[i] === spokenText[i]) matches++;
                }
                score = Math.round((matches / maxLength) * 100);
                
                // Bonus nếu chứa cụm chính xác
                if(spokenText.includes(targetText) && score < 70) score = 75;
            }

            displayScore(score);
        }

        function displayScore(score) {
            const scoreContainer = document.getElementById('score-container');
            const scoreCircle = document.getElementById('score-circle');
            const scoreText = document.getElementById('score-text');
            const feedbackText = document.getElementById('feedback-text');

            scoreContainer.classList.remove('hidden');
            scoreText.innerText = `${score}%`;

            if (score >= 80) {
                scoreCircle.className = "w-24 h-24 rounded-full border-4 border-green-500 text-green-600 flex items-center justify-center text-3xl font-black mb-2 animate-bounce";
                feedbackText.innerText = "Excellent! Phát âm rất chuẩn.";
                feedbackText.className = "text-sm font-semibold text-green-600";
            } else if (score >= 50) {
                scoreCircle.className = "w-24 h-24 rounded-full border-4 border-amber-500 text-amber-600 flex items-center justify-center text-3xl font-black mb-2";
                feedbackText.innerText = "Good! Cố gắng rõ chữ hơn tí nữa.";
                feedbackText.className = "text-sm font-semibold text-amber-600";
            } else {
                scoreCircle.className = "w-24 h-24 rounded-full border-4 border-red-500 text-red-600 flex items-center justify-center text-3xl font-black mb-2";
                feedbackText.innerText = "Keep trying! Hãy nghe kỹ phát âm mẫu.";
                feedbackText.className = "text-sm font-semibold text-red-500";
            }
        }

        // Chạy ứng dụng khi load xong trang
        window.onload = () => {
            initApp();
            // Cần click nhẹ trên trang để tải danh sách giọng nói speechSynthesis ổn định hơn
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        };
    </script>
</body>
</html>
