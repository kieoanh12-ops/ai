<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Phát Âm Tiếng Anh 11 - A Long and Healthy Life</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-6 shadow-md text-center">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide">ENGLISH PRONUNCIATION PRACTICE</h1>
        <p class="text-blue-100 mt-1">Unit 1: A Long and Healthy Life (Global Success 11)</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left Sidebar: Word List -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100 flex flex-col h-[600px]">
            <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-book text-blue-500"></i> Danh sách từ vựng
            </h2>
            
            <!-- Filter Tabs -->
            <div class="flex gap-2 mb-4 bg-slate-100 p-1 rounded-xl text-sm font-medium">
                <button onclick="filterWords('all')" id="btn-all" class="flex-1 py-2 rounded-lg text-center bg-white text-blue-600 shadow-xs cursor-pointer">Tất cả</button>
                <button onclick="filterWords('easy')" id="btn-easy" class="flex-1 py-2 rounded-lg text-center text-slate-600 hover:text-slate-800 cursor-pointer">Dễ</button>
                <button onclick="filterWords('hard')" id="btn-hard" class="flex-1 py-2 rounded-lg text-center text-slate-600 hover:text-slate-800 cursor-pointer">Khó</button>
            </div>

            <!-- List Container -->
            <div id="word-list" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                <!-- Words will be injected here by JS -->
            </div>
        </div>

        <!-- Right Workspace: Practice Area -->
        <div class="md:col-span-2 bg-white rounded-2xl shadow-sm p-6 border border-slate-100 flex flex-col justify-between min-h-[550px]">
            
            <!-- Word Display & Image -->
            <div class="text-center flex-1 flex flex-col items-center justify-center my-2">
                <span id="word-difficulty" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2"></span>
                <h2 id="current-word" class="text-4xl md:text-5xl font-black text-slate-800 tracking-tight mb-0.5">Select a word</h2>
                <p id="current-ipa" class="text-blue-600 font-mono text-base md:text-lg mb-1 font-medium tracking-wide"></p>
                <p id="current-meaning" class="text-slate-500 italic text-base mb-3"></p>
                
                <!-- Word Image -->
                <div class="w-48 h-32 md:w-64 md:h-40 rounded-xl overflow-hidden bg-slate-100 shadow-inner mb-4 flex items-center justify-center border border-slate-200 relative">
                    <!-- Loading spinner -->
                    <div id="image-loading" class="absolute inset-0 flex items-center justify-center bg-slate-100 hidden">
                        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-400"></i>
                    </div>
                    <img id="word-image" src="" alt="Vocabulary illustration" class="w-full h-full object-cover hidden">
                    <i id="image-placeholder" class="fa-regular fa-image text-4xl text-slate-300"></i>
                </div>
            </div>

            <!-- Scoring and Feedback -->
            <div class="text-center mb-4 min-h-[110px] flex items-center justify-center">
                <div id="score-container" class="hidden inline-flex flex-col items-center">
                    <div id="score-circle" class="w-20 h-20 rounded-full border-4 flex items-center justify-center text-2xl font-black mb-1 animate-bounce">
                        <span id="score-text">0%</span>
                    </div>
                    <p id="feedback-text" class="text-sm font-semibold"></p>
                    <p id="speech-transcript" class="text-xs text-slate-400 mt-0.5 italic"></p>
                </div>
            </div>

            <!-- Next Button Area -->
            <div class="text-center mb-6">
                <button onclick="nextWord()" class="inline-flex items-center gap-2 px-6 py-2.5 bg-slate-800 text-white font-bold text-sm rounded-xl hover:bg-slate-700 active:scale-95 transition shadow-md cursor-pointer">
                    <span>Câu tiếp theo</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- Interactive Controls -->
            <div class="border-t border-slate-100 pt-6">
                <div class="grid grid-cols-3 gap-4 max-w-md mx-auto">
                    
                    <!-- Listen Sample -->
                    <button onclick="listenSample()" id="btn-listen" class="flex flex-col items-center justify-center p-3 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition cursor-pointer group" title="Nghe đọc mẫu">
                        <i class="fa-solid fa-volume-high text-xl group-hover:scale-110 transition"></i>
                        <span class="text-xs font-bold mt-1">Nghe mẫu</span>
                    </button>

                    <!-- Practice (Mic) -->
                    <button onclick="toggleRecognition()" id="btn-mic" class="flex flex-col items-center justify-center p-4 bg-red-500 text-white rounded-full hover:bg-red-600 shadow-md shadow-red-200 transition transform hover:scale-105 cursor-pointer relative" style="width: 70px; height: 70px; margin: 0 auto; top: -15px;">
                        <i id="mic-icon" class="fa-solid fa-microphone text-2xl"></i>
                        <span id="mic-text" class="absolute -bottom-6 text-xs font-bold text-slate-600 w-24 text-center">Bắt đầu nói</span>
                    </button>

                    <!-- Playback Voice -->
                    <button onclick="playbackVoice()" id="btn-playback" disabled class="flex flex-col items-center justify-center p-3 bg-slate-50 text-slate-400 rounded-xl transition opacity-50 cursor-not-allowed group" title="Nghe lại giọng của bạn">
                        <i class="fa-solid fa-reply text-xl group-hover:scale-110 transition"></i>
                        <span class="text-xs font-bold mt-1">Nghe lại mình</span>
                    </button>
                    
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 bg-white mt-6">
        © 2026 Luyện Phát Âm Tiếng Anh Mỹ - Global Success 11
    </footer>

    <!-- Script Application Logic -->
    <script>
        // 1. Data Vocabulary - Đã cập nhật ĐẦY ĐỦ hình ảnh chất lượng cao riêng biệt cho tất cả 17 từ
        const vocabulary = [
            // Từ gốc trong SGK (5 từ)
            { word: "longevity", ipa: "/lɑːnˈdʒev.ə.t̬i/", meaning: "tuổi thọ", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1543333995-a78aea2eee52?q=80&w=500" },
            { word: "immune system", ipa: "/ɪˈmjuːn ˌsɪs.təm/", meaning: "hệ miễn dịch", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1576086213369-97a306d36557?q=80&w=500" },
            { word: "infectious disease", ipa: "/ɪnˈfek.ʃəs dɪˈziːz/", meaning: "bệnh truyền nhiễm", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1584036561566-baf8f5f1b144?q=80&w=500" },
            { word: "preservative", ipa: "/prɪˈzɜːr.və.t̬ɪv/", meaning: "chất bảo quản", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1622484211148-717098e912e6?q=80&w=500" },
            { word: "disinfectant", ipa: "/ˌdɪs.ɪnˈfek.tənt/", meaning: "chất khử trùng", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1584483766114-2ace6ffd65c9?q=80&w=500" },
            
            // 7 Từ DỄ bổ sung thêm
            { word: "healthy", ipa: "/ˈhel.θi/", meaning: "khỏe mạnh", difficulty: "easy", imageUrl: "https://images.unsplash.com/photo-1490645935467-78da621fd28b?q=80&w=500" },
            { word: "fitness", ipa: "/ˈfɪt.nəs/", meaning: "sự cân đối, sung sức", difficulty: "easy", imageUrl: "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=500" },
            { word: "exercise", ipa: "/ˈek.sɚ.saɪz/", meaning: "tập thể dục", difficulty: "easy", imageUrl: "https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?q=80&w=500" },
            { word: "energy", ipa: "/ˈen.ɚ.dʒi/", meaning: "năng lượng", difficulty: "easy", imageUrl: "https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?q=80&w=500" },
            { word: "diet", ipa: "/ˈdaɪ.ət/", meaning: "chế độ ăn uống", difficulty: "easy", imageUrl: "https://images.unsplash.com/photo-1498837167922-ddd27525d352?q=80&w=500" },
            { word: "sleep", ipa: "/sliːp/", meaning: "giấc ngủ", difficulty: "easy", imageUrl: "https://images.unsplash.com/photo-1511295742364-927943f308ee?q=80&w=500" },
            { word: "active", ipa: "/ˈæk.tɪv/", meaning: "năng động", difficulty: "easy", imageUrl: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=500" },
            
            // 5 Từ KHÓ bổ sung thêm
            { word: "nutritious", ipa: "/nuːˈtrɪʃ.əs/", meaning: "giàu dinh dưỡng", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=500" },
            { word: "life expectancy", ipa: "/ˈlaɪf ɪkˌspek.tən.si/", meaning: "tuổi thọ dự tính", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1447433589675-4aaa569f3e05?q=80&w=500" },
            { word: "bacteria", ipa: "/bækˈtɪr.i.ə/", meaning: "vi khuẩn", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1608220179550-e24ac053c40f?q=80&w=500" },
            { word: "treatment", ipa: "/ˈtriːt.mənt/", meaning: "sự điều trị", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1530026405186-ed1ea0ac7a63?q=80&w=500" },
            { word: "organism", ipa: "/ˈɔːr.ɡən.ɪ.zəm/", meaning: "sinh vật, cơ thể", difficulty: "hard", imageUrl: "https://images.unsplash.com/photo-1532187863486-abf9d39d6618?q=80&w=500" }
        ];

        let currentWordIndex = 0;
        let filteredWords = [...vocabulary];
        let mediaRecorder;
        let audioChunks = [];
        let audioUrl = null;
        let recognition;
        let isRecordingInstance = false;
        let currentFilterType = 'all';

        // Init Speech Recognition API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecordingInstance = true;
                updateMicUI(true);
                startAudioRecording();
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                stopAudioRecording(false);
                updateMicUI(false);
                alert("Không nhận diện được giọng nói. Vui lòng kiểm tra Micro hoặc thử lại!");
            };

            recognition.onend = () => {
                isRecordingInstance = false;
                updateMicUI(false);
            };

            recognition.onresult = (event) => {
                stopAudioRecording(true);
                const resultText = event.results[0][0].transcript.toLowerCase().trim();
                calculateScore(resultText);
            };
        } else {
            alert("Trình duyệt của bạn không hỗ trợ Web Speech API. Hãy sử dụng Google Chrome hoặc MS Edge mới nhất!");
        }

        // 2. Render & UI Functions
        function initApp() {
            renderWordList();
            selectWord(0);
            initMediaRecorder();
        }

        function renderWordList() {
            const listContainer = document.getElementById('word-list');
            listContainer.innerHTML = '';
            
            filteredWords.forEach((item, index) => {
                const isSelected = vocabulary[currentWordIndex].word === item.word;
                const diffColor = item.difficulty === 'easy' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
                
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border transition cursor-pointer flex justify-between items-center ${isSelected ? 'border-blue-500 bg-blue-50/50 shadow-xs' : 'border-slate-100 hover:bg-slate-50'}`;
                card.onclick = () => {
                    const originalIndex = vocabulary.findIndex(v => v.word === item.word);
                    selectWord(originalIndex);
                };

                card.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 text-base">${item.word}</div>
                        <div class="text-xs text-blue-600 font-mono my-0.5">${item.ipa}</div>
                        <div class="text-xs text-slate-500">${item.meaning}</div>
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded-md font-bold uppercase ${diffColor}">${item.difficulty}</span>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterWords(type) {
            currentFilterType = type;
            ['all', 'easy', 'hard'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if(t === type) {
                    btn.className = "flex-1 py-2 rounded-lg text-center bg-white text-blue-600 shadow-xs font-semibold cursor-pointer";
                } else {
                    btn.className = "flex-1 py-2 rounded-lg text-center text-slate-600 hover:text-slate-800 cursor-pointer";
                }
            });

            if (type === 'all') {
                filteredWords = [...vocabulary];
            } else {
                filteredWords = vocabulary.filter(w => w.difficulty === type);
            }
            renderWordList();
            if(filteredWords.length > 0) {
                const originalIndex = vocabulary.findIndex(v => v.word === filteredWords[0].word);
                selectWord(originalIndex);
            }
        }

        function selectWord(index) {
            currentWordIndex = index;
            const target = vocabulary[index];
            
            document.getElementById('current-word').innerText = target.word;
            document.getElementById('current-ipa').innerText = target.ipa;
            document.getElementById('current-meaning').innerText = target.meaning;
            
            // Set Difficulty Badge
            const diffBadge = document.getElementById('word-difficulty');
            diffBadge.innerText = target.difficulty;
            if(target.difficulty === 'easy') {
                diffBadge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3 bg-green-100 text-green-700";
            } else {
                diffBadge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3 bg-amber-100 text-amber-700";
            }

            // Load Illustration Image
            const imgEl = document.getElementById('word-image');
            const placeholderEl = document.getElementById('image-placeholder');
            const loadingEl = document.getElementById('image-loading');
            
            imgEl.classList.add('hidden');
            placeholderEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');
            
            imgEl.src = target.imageUrl; 
            
            imgEl.onload = () => {
                imgEl.classList.remove('hidden');
                loadingEl.classList.add('hidden');
            };
            
            imgEl.onerror = () => {
                imgEl.classList.add('hidden');
                loadingEl.classList.add('hidden');
                placeholderEl.classList.remove('hidden');
            };

            // Reset Scoring UI & Audio playback
            document.getElementById('score-container').classList.add('hidden');
            resetPlayback();

            // Re-render list to match highlight border
            renderWordList();
        }

        // Feature: Next Word
        function nextWord() {
            const currentWordObj = vocabulary[currentWordIndex];
            const filteredIdx = filteredWords.findIndex(w => w.word === currentWordObj.word);
            
            let nextFilteredIdx = filteredIdx + 1;
            if (nextFilteredIdx >= filteredWords.length) {
                nextFilteredIdx = 0;
            }

            if (filteredWords.length > 0) {
                const targetWordObj = filteredWords[nextFilteredIdx];
                const originalIndex = vocabulary.findIndex(v => v.word === targetWordObj.word);
                selectWord(originalIndex);
                
                const listContainer = document.getElementById('word-list');
                const selectedNode = listContainer.children[nextFilteredIdx];
                if (selectedNode) {
                    selectedNode.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function updateMicUI(isRecording) {
            const micBtn = document.getElementById('btn-mic');
            const micIcon = document.getElementById('mic-icon');
            const micText = document.getElementById('mic-text');

            if(isRecording) {
                micBtn.className = "flex flex-col items-center justify-center p-4 bg-red-600 text-white rounded-full shadow-lg shadow-red-300 ring-4 ring-red-200 animate-pulse cursor-pointer relative";
                micIcon.className = "fa-solid fa-stop text-2xl";
                micText.innerText = "Đang ghi âm...";
                micText.classList.add("text-red-600");
            } else {
                micBtn.className = "flex flex-col items-center justify-center p-4 bg-red-500 text-white rounded-full hover:bg-red-600 shadow-md shadow-red-200 transition transform hover:scale-105 cursor-pointer relative";
                micIcon.className = "fa-solid fa-microphone text-2xl";
                micText.innerText = "Bắt đầu nói";
                micText.classList.remove("text-red-600");
            }
            micBtn.style.width = "70px";
            micBtn.style.height = "70px";
            micBtn.style.margin = "0 auto";
            micBtn.style.top = "-15px";
        }

        // 3. Audio & Voice Operations
        function listenSample() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = vocabulary[currentWordIndex].word;
                const utterance = new SpeechSynthesisUtterance(text);
                
                const voices = window.speechSynthesis.getVoices();
                const usVoice = voices.find(voice => voice.lang.includes('en-US'));
                if (usVoice) utterance.voice = usVoice;
                
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt của bạn không hỗ trợ phát âm mẫu.");
            }
        }

        function toggleRecognition() {
            if (isRecordingInstance) {
                recognition.stop();
            } else {
                if(recognition) {
                    resetPlayback();
                    recognition.start();
                }
            }
        }

        function initMediaRecorder() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        audioUrl = URL.createObjectURL(audioBlob);
                        enablePlayback();
                    };
                }).catch(err => {
                    console.log("Quyền micro bị từ chối hoặc lỗi:", err);
                });
            }
        }

        function startAudioRecording() {
            if(mediaRecorder && mediaRecorder.state === "inactive") {
                audioChunks = [];
                mediaRecorder.start();
            }
        }

        function stopAudioRecording(saveData) {
            if(mediaRecorder && mediaRecorder.state === "recording") {
                if(!saveData) {
                    mediaRecorder.onstop = () => {};
                    mediaRecorder.stop();
                    initMediaRecorder();
                } else {
                    mediaRecorder.stop();
                }
            }
        }

        function enablePlayback() {
            const playBtn = document.getElementById('btn-playback');
            playBtn.disabled = false;
            playBtn.className = "flex flex-col items-center justify-center p-3 bg-green-50 text-green-600 rounded-xl hover:bg-green-100 transition cursor-pointer group";
        }

        function resetPlayback() {
            const playBtn = document.getElementById('btn-playback');
            playBtn.disabled = true;
            playBtn.className = "flex flex-col items-center justify-center p-3 bg-slate-50 text-slate-400 rounded-xl transition opacity-50 cursor-not-allowed group";
            if(audioUrl) {
                URL.revokeObjectURL(audioUrl);
                audioUrl = null;
            }
        }

        function playbackVoice() {
            if(audioUrl) {
                const audio = new Audio(audioUrl);
                audio.play();
            }
        }

        // 4. Algorithm Chấm điểm
        function calculateScore(spokenText) {
            const targetText = vocabulary[currentWordIndex].word.toLowerCase().trim();
            document.getElementById('speech-transcript').innerText = `Bạn đã nói: "${spokenText}"`;

            let score = 0;
            if (spokenText === targetText) {
                score = 100;
            } else {
                const maxLength = Math.max(targetText.length, spokenText.length);
                let matches = 0;
                for(let i=0; i < Math.min(targetText.length, spokenText.length); i++){
                    if(targetText[i] === spokenText[i]) matches++;
                }
                score = Math.round((matches / maxLength) * 100);
                
                if(spokenText.includes(targetText) && score < 70) score = 75;
            }

            displayScore(score);
        }

        function displayScore(score) {
            const scoreContainer = document.getElementById('score-container');
            const scoreCircle = document.getElementById('score-circle');
            const scoreText = document.getElementById('score-text');
            const feedbackText = document.getElementById('feedback-text');

            scoreContainer.classList.remove('hidden');
            scoreText.innerText = `${score}%`;

            if (score >= 80) {
                scoreCircle.className = "w-20 h-20 rounded-full border-4 border-green-500 text-green-600 flex items-center justify-center text-2xl font-black mb-1 animate-bounce";
                feedbackText.innerText = "Excellent! Phát âm rất chuẩn.";
                feedbackText.className = "text-sm font-semibold text-green-600";
            } else if (score >= 50) {
                scoreCircle.className = "w-20 h-20 rounded-full border-4 border-amber-500 text-amber-600 flex items-center justify-center text-2xl font-black mb-1";
                feedbackText.innerText = "Good! Cố gắng rõ chữ hơn tí nữa.";
                feedbackText.className = "text-sm font-semibold text-amber-600";
            } else {
                scoreCircle.className = "w-20 h-20 rounded-full border-4 border-red-500 text-red-600 flex items-center justify-center text-2xl font-black mb-1";
                feedbackText.innerText = "Keep trying! Hãy nghe kỹ phát âm mẫu.";
                feedbackText.className = "text-sm font-semibold text-red-500";
            }
        }

        window.onload = () => {
            initApp();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        };
    </script>
</body>
</html>
