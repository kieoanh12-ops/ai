<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Phát Âm: A Long and Healthy Life</title>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .word-card {
            background: var(--light);
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .word-card:hover, .word-card.active {
            border-color: var(--secondary);
            background: #e8f4fd;
        }
        .word-card h3 {
            margin: 0;
            font-size: 1.1rem;
        }
        .practice-zone {
            border: 2px dashed #bdc3c7;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            background: #fafafa;
        }
        .word-image {
            width: 100%;
            max-width: 300px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .current-word {
            font-size: 2rem;
            font-weight: bold;
            color: var(--dark);
            margin: 10px 0;
        }
        .ipa {
            font-size: 1.1rem;
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 5px;
        }
        .meaning {
            font-size: 1rem;
            color: #555;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button.action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-listen { background: #34495e; color: white; }
        .btn-slow { background: #f39c12; color: white; }
        .btn-speak { background: var(--primary); color: white; }
        .btn-speak.recording { background: var(--danger); animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        }
        .success { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>A Long and Healthy Life</h1>
    <p class="subtitle">Ứng dụng luyện phát âm Tiếng Anh 11 - Global Success (Chuẩn Mỹ)</p>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterWords('all')">Tất Cả</button>
        <button class="tab-btn" onclick="filterWords('easy')">Từ Dễ (7 từ)</button>
        <button class="tab-btn" onclick="filterWords('hard')">Từ Khó (10 từ)</button>
    </div>

    <div class="word-grid" id="wordGrid"></div>

    <div class="practice-zone" id="practiceZone" style="display: none;">
        <img id="vocabImage" class="word-image" src="" alt="Hình minh họa">
        <div class="current-word" id="vocabWord"></div>
        <div class="ipa" id="vocabIpa"></div>
        <div class="meaning" id="vocabMeaning"></div>

        <div class="btn-group">
            <button class="action-btn btn-listen" onclick="speak(1)">🔊 Nghe Đọc Trước</button>
            <button class="action-btn btn-slow" onclick="speak(0.6)">🐢 Đọc Chậm</button>
            <button class="action-btn btn-speak" id="btnSpeak" onclick="startRecognition()">🎙️ Bắt Đầu Nói</button>
        </div>

        <div class="result-box" id="resultBox"></div>
    </div>
</div>

<script>
    // Danh sách từ vựng theo yêu cầu của bạn
    const wordList = [
        // 5 Từ gốc của bạn (Xếp vào nhóm Khó do âm tiết dài/phức tạp)
        { word: "longevity", ipa: "/lɑːnˈdʒev.ə.t̬i/", meaning: "Tuổi thọ", level: "hard", img: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=400" },
        { word: "immune system", ipa: "/ɪˈmjuːn ˌsɪs.təm/", meaning: "Hệ miễn dịch", level: "hard", img: "https://images.unsplash.com/photo-1584036561566-baf241f8024a?w=400" },
        { word: "infectious disease", ipa: "/ɪnˈfek.ʃəs dɪˈziːz/", meaning: "Bệnh truyền nhiễm", level: "hard", img: "https://images.unsplash.com/photo-1584118624012-df056829fba0?w=400" },
        { word: "preservative", ipa: "/prɪˈzɜːr.və.t̬ɪv/", meaning: "Chất bảo quản", level: "hard", img: "https://images.unsplash.com/photo-1547514701-42782101795e?w=400" },
        { word: "disinfectant", ipa: "/ˌdɪs.ɪnˈfek.tənt/", meaning: "Chất khử trùng", level: "hard", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400" },

        // Thêm 7 từ DỄ (Chủ đề Sức khỏe, từ ngắn, dễ phát âm)
        { word: "health", ipa: "/helθ/", meaning: "Sức khỏe", level: "easy", img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=400" },
        { word: "fitness", ipa: "/ˈfɪt.nəs/", meaning: "Sự sung sức, cân đối", level: "easy", img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=400" },
        { word: "diet", ipa: "/ˈdaɪ.ət/", meaning: "Chế độ ăn uống", level: "easy", img: "https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=400" },
        { word: "exercise", ipa: "/ˈek.sɚ.saɪz/", meaning: "Tập thể dục", level: "easy", img: "https://images.unsplash.com/photo-1518611012118-696072aa579a?w=400" },
        { word: "sleep", ipa: "/sliːp/", meaning: "Giấc ngủ", level: "easy", img: "https://images.unsplash.com/photo-1511295742364-92b9345f6852?w=400" },
        { word: "germ", ipa: "/dʒɜːrm/", meaning: "Vi khuẩn, mầm bệnh", level: "easy", img: "https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400" },
        { word: "active", ipa: "/ˈæk.tɪv/", meaning: "Tích cực, hoạt động", level: "easy", img: "https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=400" },

        // Thêm 5 từ KHÓ (Từ vựng nâng cao trong bài học)
        { word: "life expectancy", ipa: "/ˈlaɪf ɪkˌspek.tən.si/", meaning: "Tuổi thọ dự tính", level: "hard", img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=400" },
        { word: "nutritious", ipa: "/nuːˈtrɪʃ.əs/", meaning: "Bổ dưỡng, giàu dinh dưỡng", level: "hard", img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400" },
        { word: "antibiotics", ipa: "/ˌæn.t̬i.baɪˈɑː.t̬ɪks/", meaning: "Thuốc kháng sinh", level: "hard", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400" },
        { word: "treatment", ipa: "/ˈtriːt.mənt/", meaning: "Liệu trình điều trị", level: "hard", img: "https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=400" },
        { word: "vaccine", ipa: "/vækˈsiːn/", meaning: "Vắc-xin", level: "hard", img: "https://images.unsplash.com/photo-1618961734760-466979ce35b0?w=400" }
    ];

    let currentSelectedWord = null;

    // Hiển thị danh sách từ vựng lên màn hình
    function displayWords(filter = "all") {
        const grid = document.getElementById("wordGrid");
        grid.innerHTML = "";
        
        wordList.forEach((item) => {
            if (filter !== "all" && item.level !== filter) return;

            const card = document.createElement("div");
            card.className = "word-card";
            card.onclick = () => selectWord(item, card);
            card.innerHTML = `
                <h3>${item.word}</h3>
                <small style="color:${item.level === 'easy' ? '#2ecc71':'#e74c3c'}">
                    ${item.level === 'easy' ? '🟢 Dễ' : '🔴 Khó'}
                </small>
            `;
            grid.appendChild(card);
        });
    }

    // Lọc từ vựng theo Tab
    function filterWords(level) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        displayWords(level);
        document.getElementById("practiceZone").style.display = "none";
    }

    // Chọn từ để luyện tập
    function selectWord(item, cardElement) {
        document.querySelectorAll('.word-card').forEach(c => c.classList.remove('active'));
        cardElement.classList.add('active');

        currentSelectedWord = item;
        document.getElementById("practiceZone").style.display = "block";
        document.getElementById("vocabImage").src = item.img;
        document.getElementById("vocabWord").innerText = item.word;
        document.getElementById("vocabIpa").innerText = item.ipa;
        document.getElementById("vocabMeaning").innerText = `Ý nghĩa: ${item.meaning}`;
        
        // Ẩn hộp kết quả cũ
        const resultBox = document.getElementById("resultBox");
        resultBox.style.display = "none";
    }

    // Tính năng Đọc mẫu (SpeechSynthesis) chuẩn giọng Mỹ (en-US)
    function speak(speed = 1) {
        if (!currentSelectedWord) return;
        
        // Xóa các giọng đang đọc dở (nếu có)
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(currentSelectedWord.word);
        utterance.lang = 'en-US'; // Thiết lập chuẩn giọng Anh-Mỹ
        utterance.rate = speed;   // Tốc độ đọc

        window.speechSynthesis.speak(utterance);
    }

    // Tính năng Nhận diện và chấm điểm phát âm (Web Speech API)
    function startRecognition() {
        if (!currentSelectedWord) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Hãy dùng Google Chrome!");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // Nhận diện chuẩn giọng Mỹ
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const btnSpeak = document.getElementById("btnSpeak");
        const resultBox = document.getElementById("resultBox");

        btnSpeak.innerText = "🎤 Đang lắng nghe...";
        btnSpeak.classList.add("recording");
        resultBox.style.display = "none";

        recognition.start();

        recognition.onresult = function(event) {
            // Lấy từ ngữ hệ thống nghe được từ bạn và chuyển thành chữ thường
            const spokenText = event.results[0][0].transcript.toLowerCase().trim();
            const targetWord = currentSelectedWord.word.toLowerCase().trim();
            
            resultBox.style.display = "block";

            // Thuật toán chấm điểm đơn giản: so khớp trực tiếp chuỗi ký tự
            if (spokenText === targetWord) {
                resultBox.className = "result-box success";
                resultBox.innerHTML = `💯 Điểm: 100/100<br>Tuyệt vời! Bạn phát âm chính xác: "<strong>${event.results[0][0].transcript}</strong>"`;
            } else {
                // Nếu sai, tính toán tỷ lệ tương đồng ký tự cơ bản để chấm điểm
                let score = calculateSimilarity(targetWord, spokenText);
                if (score > 60) {
                    resultBox.className = "result-box success";
                    resultBox.innerHTML = `⭐ Điểm: ${score}/100<br>Khá tốt! Bạn nói: "<strong>${event.results[0][0].transcript}</strong>"`;
                } else {
                    resultBox.className = "result-box fail";
                    resultBox.innerHTML = `❌ Điểm: ${score}/100<br>Chưa chính xác. Máy nghe thành: "<strong>${event.results[0][0].transcript}</strong>". Bạn hãy thử nhấn "Đọc chậm nghe kĩ" rồi thử lại nhé!`;
                }
            }
        };

        recognition.onspeechend = function() {
            recognition.stop();
            btnSpeak.innerText = "🎙️ Bắt Đầu Nói";
            btnSpeak.classList.remove("recording");
        };

        recognition.onerror = function(event) {
            btnSpeak.innerText = "🎙️ Bắt Đầu Nói";
            btnSpeak.classList.remove("recording");
            alert("Đã xảy ra lỗi nhận diện hoặc không nghe thấy tiếng: " + event.error);
        };
    }

    // Hàm bổ trợ tính điểm tương đối dựa trên độ trùng khớp từ ngữ
    function calculateSimilarity(str1, str2) {
        let matches = 0;
        const len = Math.max(str1.length, str2.length);
        for (let i = 0; i < Math.min(str1.length, str2.length); i++) {
            if (str1[i] === str2[i]) matches++;
        }
        return Math.round((matches / len) * 100);
    }

    // Khởi chạy ứng dụng ban đầu
    displayWords('all');
</script>

</body>
</html>
